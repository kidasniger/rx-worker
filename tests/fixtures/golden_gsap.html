<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Golden gsapvideo RENDRAX</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #0b0f1a; overflow: hidden; }
  #st { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0f1a; transform-origin: 0 0; }
  #t1 { position: absolute; left: 90px; top: 540px; font: 800 190px/1 Arial, sans-serif; color: #ffffff; white-space: nowrap; }
  #t2 { position: absolute; left: 90px; top: 880px; font: 600 44px/1.3 Arial, sans-serif; color: #9fb0c9; }
  #num { position: absolute; left: 90px; top: 1050px; font: 800 130px/1 Arial, sans-serif; color: #31d0aa; }
  #pg { position: absolute; left: 90px; top: 1260px; width: 900px; height: 14px; background: #1d2736; }
  #pgfill { position: absolute; inset: 0; width: 100%; background: #31d0aa; }
  #sb { position: absolute; left: 60px; bottom: 170px; width: 960px; text-align: center; font: 600 40px/1.3 Arial, sans-serif; color: #ffffff; }
  #go { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0f1a; color: #ffffff; font: 800 60px Arial, sans-serif; }
</style>
</head>
<body>
<div id="st" style="transform: scale(0.5);">
  <div id="t1">VIBE</div>
  <div id="t2">rendu image par image</div>
  <div id="num">0</div>
  <div id="pg"><div id="pgfill"></div></div>
  <div id="sb"></div>
  <div id="go">Chargement…</div>
</div>
<audio id="a" src="data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//uQxAAAAAAAAAAAAAAAAAAAAAAAWW5YyOUAAAAAAAAAAAAAAAAAAAAAAA"></audio>
<script>
window.__profile = 'gsapvideo';
window.__md_errors = [];
window.onerror = function (message, source, ligne, col) {
  window.__md_errors.push(message + ' @' + ligne + ':' + col);
};
const T = [0, 3];
const D = 3;
const END = 3;
const SUB = [[0.1, 'Première phrase affichée.'], [1.4, ''], [1.6, 'Deuxième phrase.'], [2.8, '']];
const SW = [
  [['Première', 0.1], ['phrase', 0.35], ['affichée', 0.7]],
  [['Deuxième', 1.6], ['phrase', 1.9], ['finale', 2.2]]
];
function at(i, mot, dec) {
  dec = dec || 0;
  const ph = SW[i] || [];
  const n = String(mot || '').toLowerCase();
  for (let k = 0; k < ph.length; k += 1) {
    if (String(ph[k][0]).toLowerCase().indexOf(n) === 0) return ph[k][1] + dec;
  }
  return (ph.length ? ph[0][1] : 0) + dec;
}
const ST = [0, 1.6];
let started = false;
const a = document.querySelector('#a');
tl = gsap.timeline({ paused: true });
// Exercice des primitives motion design (injectées via JS_HELPERS au rendu) :
MD.grainFX();
MD.popIn(tl, '#t2', { at: at(0, 'phrase', 0.05) });
MD.heroWord(tl, '#t1', { at: at(0, 'phrase'), size: 190 });
MD.accent(tl, '#t2', { at: at(0, 'affichée', 0.1) });
MD.countTo(tl, '#num', { at: at(1, 'phrase'), from: 0, to: 87, suffix: '%', dur: 0.9 });
MD.bar(tl, '#pgfill', { at: at(1, 'phrase'), pct: 70, dur: 1 });
tl.to('#t2', { opacity: 1, duration: 0.2 }, 2.2);
MD.outSlide(tl, '#t1', { at: 2.3, dir: 'l' });
MD.outMask(tl, '#t2', { at: 2.45 });
MD.outMask(tl, '#num', { at: 2.5 });
MD.rideau(tl, { at: 2.7, mode: 'close' });
tl.time(0, false);
function lp() {
  if (started) {
    a.currentTime = tl.time();
  }
  requestAnimationFrame(lp);
}
lp();
</script>
</body>
</html>
