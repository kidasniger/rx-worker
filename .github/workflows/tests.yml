name: Tests
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: rx-worker-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilation de tous les modules
        run: |
          set -euo pipefail
          python -m compileall -q gsap.py tts.py html2mp4.py h2m scripts
          echo "Compilation OK"
      - name: Tests de l'extraction ZIP défensive
        run: python -m unittest discover -s tests -v
