name: Voix (synthèse vocale)
run-name: Voix ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      blob_id:
        description: "Identifiant du texte dans le stockage privé (rempli par la page web)"
        required: true
      voix:
        description: "Voix Edge TTS"
        required: false
        default: "fr-FR-VivienneMultilingualNeural"
      vitesse:
        description: "Vitesse (ex : -5%, +10%)"
        required: false
        default: "-5%"
      ton:
        description: "Ton (ex : -2Hz, +5Hz)"
        required: false
        default: "-2Hz"
      tag:
        description: "Identifiant de la voix (rempli par la page web)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  voix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Edge TTS
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --no-input --retries 2 --timeout 20 \
            "edge-tts>=6.1,<8" mutagen
          python -c "import edge_tts, mutagen; print('edge-tts et mutagen installés')"

      - name: Récupérer le texte
        env:
          BLOB_ID: ${{ inputs.blob_id }}
        run: |
          set -euo pipefail
          [[ "$BLOB_ID" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant temporaire invalide."; exit 1; }
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC indisponible; vérifie id-token: write}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC indisponible; vérifie id-token: write}"
          OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frendrax.vercel.app%2Fkidas-render"
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$OIDC_REQUEST_URL" | jq -er '.value')"
          echo "::add-mask::${OIDC_TOKEN}"
          mkdir -p kidas-tmp
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://rendrax.vercel.app/api/videos?action=tts-source&id=${BLOB_ID}&run_id=${GITHUB_RUN_ID}" \
            --output kidas-tmp/texte.txt
          test -s kidas-tmp/texte.txt || { echo "::error::Le texte temporaire est vide."; exit 1; }
          echo "Texte récupéré ($(wc -c < kidas-tmp/texte.txt) octets)."

      - name: Générer la voix
        env:
          TEXTE_FICHIER: kidas-tmp/texte.txt
          SORTIE: sortie
          VOIX: ${{ inputs.voix }}
          VITESSE: ${{ inputs.vitesse }}
          TON: ${{ inputs.ton }}
        run: python tts.py

      - name: Publier le MP3 et les repères dans Backblaze B2 privé
        env:
          VIDEO_ID: ${{ inputs.tag }}
          VOIX: ${{ inputs.voix }}
        run: |
          set -euo pipefail
          [[ "$VIDEO_ID" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant de voix invalide."; exit 1; }
          test -s sortie/audio.mp3 && test -s sortie/timings.json || { echo "::error::MP3 ou repères manquants."; exit 1; }

          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC indisponible; vérifie id-token: write}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC indisponible; vérifie id-token: write}"
          OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frendrax.vercel.app%2Fkidas-render"
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$OIDC_REQUEST_URL" | jq -er '.value')"
          echo "::add-mask::${OIDC_TOKEN}"

          audio_size="$(stat -c '%s' sortie/audio.mp3)"
          timings_size="$(stat -c '%s' sortie/timings.json)"
          duration="$(jq -er '.duration' sortie/timings.json)"
          upload="$(jq -cn --arg id "$VIDEO_ID" --arg run_id "$GITHUB_RUN_ID" \
            --argjson audio_size "$audio_size" --argjson timings_size "$timings_size" \
            '{id:$id,run_id:$run_id,audio_size:$audio_size,timings_size:$timings_size}')"
          urls="$(curl --fail --silent --show-error --retry 2 \
            -X POST "https://rendrax.vercel.app/api/videos?action=tts-upload-url" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" --data "$upload")"
          audio_url="$(jq -er '.audioUrl' <<< "$urls")"
          timings_url="$(jq -er '.timingsUrl' <<< "$urls")"

          curl --fail --silent --show-error --location --retry 2 \
            -X PUT "$audio_url" -H "Content-Type: audio/mpeg" --data-binary "@sortie/audio.mp3"
          curl --fail --silent --show-error --location --retry 2 \
            -X PUT "$timings_url" -H "Content-Type: application/json" --data-binary "@sortie/timings.json"

          publish="$(jq -cn --arg id "$VIDEO_ID" --arg run_id "$GITHUB_RUN_ID" --arg voix "$VOIX" \
            --argjson duration "$duration" '{id:$id,run_id:$run_id,voix:$voix,duration:$duration}')"
          curl --fail --silent --show-error --retry 2 \
            -X POST "https://rendrax.vercel.app/api/videos?action=tts-publish" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" --data "$publish"

      - name: Supprimer le texte et les fichiers temporaires
        if: ${{ always() }}
        env:
          BLOB_ID: ${{ inputs.blob_id }}
        run: |
          rm -rf kidas-tmp sortie
          if [ -n "$BLOB_ID" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "::warning::OIDC indisponible; le texte privé sera purgé par le nettoyage automatique."
              exit 0
            fi
            OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frendrax.vercel.app%2Fkidas-render"
            if ! OIDC_TOKEN="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$OIDC_REQUEST_URL" | jq -er '.value')"; then
              echo "::warning::Impossible d’obtenir le jeton OIDC pour le nettoyage."
              exit 0
            fi
            echo "::add-mask::${OIDC_TOKEN}"
            curl --fail --silent --show-error --location --retry 2 \
              -X POST "https://rendrax.vercel.app/api/videos?action=tts-cleanup" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"id\":\"${BLOB_ID}\",\"run_id\":\"${GITHUB_RUN_ID}\"}" \
              || echo "::warning::Le nettoyage du texte privé a échoué; le cron le purgera sous 2 h."
          fi
